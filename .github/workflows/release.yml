name: Release

# Runs after the "Go CI" workflow completes on a pushed tag. The tag push
# itself triggers Go CI (tests); this workflow only releases if those tests
# passed. Note: workflow_run always uses the copy of this file from the
# default branch.
on:
  workflow_run:
    workflows: [Go CI]
    types: [completed]

permissions:
  contents: write

env:
  # For tag pushes, head_branch holds the tag name (GITHUB_REF_NAME would be
  # the default branch in this workflow).
  TAG: ${{ github.event.workflow_run.head_branch }}

jobs:
  validate:
    name: Validate tag
    # Only release on tag pushes whose test run succeeded. Go CI's push
    # trigger only fires for tags, so event == 'push' means a tag push;
    # pull_request completions are skipped here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format (vX.Y.Z with optional -alpha.N/-beta.N suffix)
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::'${TAG}' does not match the required format v<major>.<minor>.<patch> with an optional -alpha.N or -beta.N suffix (e.g. v2.1.0, v2.1.0-beta.1)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::'${TAG}' is not a tag in this repository."
            exit 1
          fi

      - name: Verify tag is on the v2 branch
        run: |
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/v2; then
            echo "::error::Tag '${TAG}' points to a commit that is not on the 'v2' branch. Only tags on 'v2' are released."
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -ldflags "-s -w -X main.version=${TAG}" \
            -o "build/kvf-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvf-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: build/

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXTRA_ARGS=()
          if [[ "${TAG}" =~ -(alpha|beta)\.[0-9]+$ ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "${TAG}" dist/kvf-* \
            --title "${TAG}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
